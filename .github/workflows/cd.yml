name: BrewLite CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cd:
    name: Delivery & Deploy Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite?schema=public
      DIRECT_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite?schema=public
      JWT_ACCESS_SECRET: cd-dummy-access-secret-brewlite-key
      JWT_REFRESH_SECRET: cd-dummy-refresh-secret-brewlite-key
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # ==========================================
      # 1. Quality Gate (Install -> Lint -> Test -> Build)
      # ==========================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir backend run prisma:generate

      - name: Lint backend & frontend
        run: |
          pnpm --dir backend run lint
          pnpm --dir frontend run lint

      - name: Unit test backend (Vitest)
        run: pnpm --dir backend run test

      - name: Build backend & frontend
        run: |
          pnpm --dir backend run build
          pnpm --dir frontend run build

      # ==========================================
      # 2. Docker Image & Registry (ghcr.io)
      # ==========================================
      - name: Set lowercase repository image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # 3. Deploy Production (Render & Vercel)
      # ==========================================
      - name: Trigger Deploy Hooks
        run: |
          echo "🚀 Triggering Render deploy hook..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "🚀 Triggering Vercel deploy hook..."
          curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      # ==========================================
      # 4. Health Check / Smoke Test
      # ==========================================
      - name: Health Check / Smoke Test
        run: |
          echo "⏳ Waiting for services to become available..."
          echo "🔍 Checking Backend health at: ${{ secrets.BACKEND_HEALTH_URL }}"
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 15 \
            "${{ secrets.BACKEND_HEALTH_URL }}"

          echo ""
          echo "🔍 Checking Frontend availability at: ${{ secrets.FRONTEND_URL }}"
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 15 \
            "${{ secrets.FRONTEND_URL }}"

          echo ""
          echo "✅ Smoke test passed successfully! Production is healthy."

      # ==========================================
      # 5. Rollback Guidance on Failure
      # ==========================================
      - name: Rollback Instructions
        if: failure()
        run: |
          echo "=========================================================="
          echo "🚨 DEPLOYMENT OR SMOKE TEST FAILED!"
          echo "=========================================================="
          echo "Pipeline đã dừng lại để ngăn chặn sự cố lan rộng."
          echo ""
          echo "📋 HƯỚNG DẪN ROLLBACK THỦ CÔNG:"
          echo "1. GitHub Container Registry (ghcr.io):"
          echo "   - Image: ${{ env.IMAGE_NAME }}"
          echo "   - Tag commit SHA lỗi: sha-${GITHUB_SHA::7}"
          echo "   - Bạn có thể lấy lại tag SHA trước đó trên ghcr.io để deploy lại."
          echo ""
          echo "2. Render (Backend):"
          echo "   - Truy cập: https://dashboard.render.com"
          echo "   - Vào service Backend -> chọn mục 'Events' hoặc 'Deploys'."
          echo "   - Tìm bản deploy thành công gần nhất và nhấn 'Rollback to this deploy'."
          echo ""
          echo "3. Vercel (Frontend):"
          echo "   - Truy cập: https://vercel.com/dashboard"
          echo "   - Vào project Frontend -> chọn mục 'Deployments'."
          echo "   - Tìm bản deployment ổn định gần nhất -> chọn '...' -> 'Promote to Production'."
          echo "=========================================================="
          exit 1
